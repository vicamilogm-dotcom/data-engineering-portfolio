services:
  postgres:
    image: postgres:14.2
    env_file:
      - .env
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./database:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d db -U airflow || exit 1"]
      interval: 15s
      retries: 5
    restart: always

  scheduler:
    build: .
    env_file:
      - .env
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres:5432/db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
      - ./dags:/app/airflow/dags
      - ./data:/app/airflow/data
      - ./logs:/app/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
    command: bash -c "poetry run airflow db upgrade && poetry run airflow scheduler"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "poetry run airflow jobs check --job-type SchedulerJob --local || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  webserver:
    build: .
    env_file:
      - .env
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres:5432/db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
      - ./dags:/app/airflow/dags
      - ./data:/app/airflow/data
      - ./logs:/app/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      scheduler:
        condition: service_started
    command: ./scripts/entrypoint.sh
    ports:
      - "8080:8080"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
