version: 2

models:
  - name: beers_country
    description: Joining transactions and beers tables
    columns:
      - name: country_of_origin
        # Test applied to a specific column
        data_tests:
          - dbt_utils.not_accepted_values:
              values: ["Australia", "USA"]

    # Tests that interact with more than one column
    data_tests:
      - unique:
          column_name: "CONCAT(product_code, date_and_time_of_unloading)"
      # Equivalent to the above
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - product_code
            - date_and_time_of_unloading
