# dbt should work with this file in the dbt project root (same level as dbt_project.yml)
# Alternatively move it to ~/.dbt/

lw_beer_profile:
  outputs:
    dev:
      dataset: lw_beer
      job_execution_timeout_seconds: 300
      job_retries: 1
      location: EU
      method: oauth
      priority: interactive
      project: your_project_id # Don't forget to update with your project_id
      threads: 1
      type: bigquery
    prod:
      dataset: lw_beer_prod
      job_execution_timeout_seconds: 300
      job_retries: 1
      location: EU
      method: oauth
      priority: interactive
      project: your_project_id # Don't forget to update with your project_id
      threads: 1
      type: bigquery
  target: dev
