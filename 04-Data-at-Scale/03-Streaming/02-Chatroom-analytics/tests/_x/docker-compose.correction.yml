services:
  rabbitmq:
    image: rabbitmq:3.13.7-management
    container_name: rmq
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      - RABBITMQ_DEFAULT_USER=rmq
    env_file:
      - .env
  clickhouse:
    image: clickhouse/clickhouse-server:23.7.4.5-alpine
    container_name: clickhouse
    ports:
      - 9000:9000
    environment:
      - CLICKHOUSE_DB=chat
      - CLICKHOUSE_USER=rmq
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    env_file:
      - .env
