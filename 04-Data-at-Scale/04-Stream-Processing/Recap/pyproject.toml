[tool.poetry]
name = "beam-recap"
version = "0.1.0"
description = ""
authors = ["Lorcan Rae <lorcanrae@gmail.com>"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "~3.12.7" # required for GCP DataFlow workers - should not impact students working locally
pandas = "^2.2.3"
apache-beam = {extras = ["gcp"], version = "^2.61.0"}
numpy = ">=1.14.3,<2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = ["optional: not required, nor saved in test_output.txt"]
