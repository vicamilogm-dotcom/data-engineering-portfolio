services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - 8080:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 1m30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      # - api:/app/api
      # /app for WORKDIR in Dockerfile
      # .dockerignore does not work with bind mounts and volumes, only `docker build`
      # Be precise with what you want in a container
      - ./api:/app/api
    command: ["uvicorn", "api.fast:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - DB_URL=postgresql+psycopg2://postgres:$POSTGRES_PASSWORD@db:5432/postgres
    networks:
      - backend
    depends_on:
      - db

  db:
    image: postgres:14.2
    environment:
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
    networks:
      - backend

# volumes:
#   api:

networks:
  # Network name is arbitrary
  backend:
    driver: bridge
