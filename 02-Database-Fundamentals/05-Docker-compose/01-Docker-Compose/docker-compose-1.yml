
version: "3.9"

services:
  webapi:
    container_name: fastapi
    build:
      context: .
      dockerfile: dockerfile-fastapi
    restart: on-failure
    ports:
      - "8000:8000"
    volumes:
      - ./api-no-database:/app/api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
